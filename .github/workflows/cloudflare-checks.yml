name: Cloudflare migration checks

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "lib/ledger-core.mjs"
      - "lib/demo-portability.mjs"
      - ".github/workflows/cloudflare-checks.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "lib/ledger-core.mjs"
      - "lib/demo-portability.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test Worker security and SQLite ledger invariants
        run: npm run test
        working-directory: cloudflare
      - name: Build static frontend from shared demo modules
        run: npm run build
        working-directory: cloudflare
      - name: Check Worker and browser script syntax
        run: |
          node --check src/worker.mjs
          node --check public/app.js
          test -f public/shared/ledger-core.mjs
          test -f public/shared/demo-portability.mjs
        working-directory: cloudflare
